<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webslist — Campus Corkboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cork-1:#d1c8c1e7;
    --cork-2:#a7a29fbb;
    --cork-3:#d39e80;
    --paper:#ffffff;
    --paper-edge:#efe4cc;
    --ink:#000000;
    --ink-soft:#5b4c3b;
    --pin-red:#d64545;
    --pin-teal:#2f9c95;
    --pin-mustard:#e3a83b;
    --pin-blue:#3e6fa0;
    --pin-plum:#8e5a8f;
    --shadow:rgba(30,20,10,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(ellipse at 80% 60%, rgba(0,0,0,0.12), transparent 45%),
      radial-gradient(ellipse at 50% 90%, rgba(0,0,0,0.10), transparent 40%),
      repeating-radial-gradient(circle at 10% 10%, rgba(0,0,0,0.03) 0, rgba(0,0,0,0.03) 1px, transparent 2px, transparent 6px),
      linear-gradient(180deg, var(--cork-1), var(--cork-2) 60%, var(--cork-3));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background: var(--pin-mustard); color: var(--ink); }

  a{ color:inherit; }

  .app{
    max-width:1100px;
    margin:0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Header ---------- */
  header.site{
    text-align:center;
    padding: 18px 0 36px;
    position:relative;
  }
  .school-logo{
    position:absolute;
    top:18px; 
    left:20px;
    width:auto;
    height: 100px;
  }
  .board-sign{
    display:inline-block;
    background: var(--paper);
    padding: 10px 34px 14px;
    border-radius: 3px;
    box-shadow: 0 10px 22px var(--shadow), inset 0 0 0 1px rgba(0,0,0,0.04);
    transform: rotate(-1.2deg);
    position:relative;
  }
  .board-sign:before{
    content:"";
    position:absolute;
    top:-11px; left:50%;
    width:16px; height:16px;
    margin-left:-8px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a8a, var(--pin-red) 55%, #7a1f1f 100%);
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }
  .board-sign h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 3.1rem;
    line-height:1;
    margin:6px 0 4px;
    letter-spacing:0.5px;
  }
  .board-sign p{
    margin:0;
    font-size:0.92rem;
    color: var(--ink-soft);
    font-weight:500;
  }

  .crumbs{
    text-align:center;
    margin: 18px 0 0;
    font-size:0.85rem;
    color: rgba(255,255,255,0.85);
  }
  .crumbs button{
    background:none;border:none;color:inherit;font:inherit;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;padding:0;
  }

  /* ---------- Category grid (home) ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 30px 26px;
    margin-top: 40px;
  }

  .pin-card{
    position:relative;
    background: var(--paper);
    border-radius: 2px;
    padding: 22px 20px 20px;
    box-shadow: 0 12px 20px var(--shadow), inset 0 0 40px rgba(139,99,73,0.05);
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    min-height:150px;
  }
  .pin-card:hover{
    transform: translateY(-4px) rotate(0deg) !important;
    box-shadow: 0 18px 28px var(--shadow);
  }
  .pin-card:nth-child(6n+1){ transform: rotate(-2.4deg); }
  .pin-card:nth-child(6n+2){ transform: rotate(1.6deg); }
  .pin-card:nth-child(6n+3){ transform: rotate(-1deg); }
  .pin-card:nth-child(6n+4){ transform: rotate(2.1deg); }
  .pin-card:nth-child(6n+5){ transform: rotate(-1.7deg); }
  .pin-card:nth-child(6n+6){ transform: rotate(1.1deg); }

  .pin{
    position:absolute; top:-10px; left:50%; margin-left:-9px;
    width:18px; height:18px; border-radius:50%;
    box-shadow: 0 3px 4px rgba(0,0,0,0.45);
  }
  .cat-title{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.7rem;
    margin: 8px 0 6px;
  }
  .cat-desc{
    font-size:0.86rem;
    color: var(--ink-soft);
    line-height:1.4;
    margin:0 0 14px;
  }
  .cat-count{
    display:inline-block;
    font-size:0.72rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:3px 9px;
    border-radius:20px;
    background: rgba(46,36,25,0.08);
    color: var(--ink-soft);
  }

  /* ---------- Post button (floating pin) ---------- */
  .post-fab{
    position:fixed;
    bottom:26px; right:26px;
    background: var(--pin-teal);
    color:#fff;
    border:none;
    padding:14px 22px;
    border-radius: 40px;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    transition: transform .15s ease;
    z-index: 50;
  }
  .post-fab:hover{ transform: translateY(-3px) scale(1.03); }

  /* ---------- Listing view ---------- */
  .panel{
    background: rgba(251,243,227,0.94);
    border-radius: 6px;
    padding: 26px;
    box-shadow: 0 14px 30px var(--shadow);
    margin-top: 24px;
  }
  .listing-head{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .listing-head h2{
    font-family:'Caveat', cursive;
    font-size:2.1rem;
    margin:0;
  }
  .search-row{
    display:flex; gap:10px; flex-wrap:wrap;
  }
  input[type=text], select, textarea, input[type=email], input[type=tel], input[type=number]{
    font-family:'Work Sans',sans-serif;
    font-size:0.9rem;
    padding:9px 12px;
    border:1px solid var(--paper-edge);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  .search-row input[type=text]{ min-width:220px; }

  .post-list{ display:flex; flex-direction:column; gap:12px; }
  .post-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    background:#fff;
    border:1px solid var(--paper-edge);
    border-left:5px solid var(--pin-teal);
    border-radius:5px;
    padding:14px 16px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .post-row:hover{ transform: translateX(3px); box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
  .post-row h3{ margin:0 0 4px; font-size:1.05rem; }
  .post-row p{ margin:0; font-size:0.85rem; color:var(--ink-soft); }
  .post-meta{ text-align:right; font-size:0.75rem; color:var(--ink-soft); white-space:nowrap; }
  .price-tag{
    display:inline-block; margin-top:4px;
    background: var(--pin-mustard); color:#3a2a05;
    font-weight:700; font-size:0.85rem;
    padding:2px 10px; border-radius:20px;
  }
  .empty-note{
    text-align:center; padding:40px 10px; color:var(--ink-soft); font-size:0.95rem;
  }

  /* ---------- Post detail ---------- */
  .detail-card{
    background:var(--paper);
    border-radius:6px;
    padding:30px 30px 0;
    box-shadow: 0 14px 30px var(--shadow);
    margin-top:24px;
    position:relative;
  }
  .detail-card .pin{ top:-10px; }
  .tag-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
  .cat-chip{
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:3px 10px; border-radius:20px; color:#fff;
  }
  .detail-card h2{ font-family:'Caveat', cursive; font-size:2.4rem; margin:2px 0 10px; }
  .detail-meta{ font-size:0.82rem; color:var(--ink-soft); margin-bottom:18px; }
  .detail-body{ font-size:0.98rem; line-height:1.65; white-space:pre-wrap; margin-bottom:8px; }
  .detail-price{ font-size:1.3rem; font-weight:700; color:#7a4e00; margin-bottom:10px; }

  .tear-strip{
    display:flex;
    border-top:2px dashed rgba(46,36,25,0.35);
    margin-top:22px;
  }
  .tear-tab{
    flex:1;
    text-align:center;
    padding:14px 2px 16px;
    border-left:1px dashed rgba(46,36,25,0.3);
    cursor:pointer;
    font-size:0.78rem;
    color: var(--ink-soft);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing:0.03em;
    transition: transform .25s ease, opacity .25s ease;
    user-select:none;
  }
  .tear-tab:first-child{ border-left:none; }
  .tear-tab:hover{ background: rgba(46,36,25,0.04); color:var(--ink); }
  .tear-tab.torn{
    transform: translateY(60px) rotate(8deg);
    opacity:0;
    pointer-events:none;
  }
  .tear-hint{
    text-align:center; font-size:0.72rem; color:var(--ink-soft); opacity:0.8;
    padding:6px 0 16px;
  }

  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:6px; font-size:0.85rem;
    opacity:0; transition: opacity .25s ease, transform .25s ease;
    pointer-events:none; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- New post form ---------- */
  .index-card{
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(62,111,160,0.12) 28px),
      var(--paper);
    border-radius:6px;
    padding:28px 30px 30px;
    box-shadow: 0 14px 30px var(--shadow);
    margin-top:24px;
  }
  .index-card h2{ font-family:'Caveat', cursive; font-size:2.1rem; margin:0 0 18px; }
  .field{ margin-bottom:16px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); }
  .field input, .field select, .field textarea{ width:100%; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px){ .two-col{ grid-template-columns:1fr; } }
  textarea{ min-height:110px; resize:vertical; font-family:'Work Sans',sans-serif; line-height:1.6; }
  .form-actions{ display:flex; gap:12px; margin-top:8px; }
  .btn{
    font-family:'Work Sans',sans-serif; font-weight:600; font-size:0.9rem;
    padding:11px 22px; border-radius:6px; border:none; cursor:pointer;
  }
  .btn-primary{ background: var(--pin-teal); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--paper-edge); }
  .btn-ghost:hover{ background: rgba(0,0,0,0.04); }
  .error-msg{ color:#a02020; font-size:0.82rem; margin-top:-6px; margin-bottom:10px; display:none; }
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Data ---------------- */
const CATEGORIES = [
  { id:'study',  name:'Study Groups',   color:'var(--pin-blue)',    pin:'#3e6fa0', desc:'Find or start a study group for any class.' },
  { id:'clubs',  name:'Clubs & Events', color:'var(--pin-teal)',    pin:'#2f9c95', desc:'Meetings, tryouts, recruiting, and announcements.' },
  { id:'trade',  name:'Buy / Sell / Trade', color:'var(--pin-mustard)', pin:'#e3a83b', desc:'Textbooks, calculators, gear, and swaps.' },
  { id:'lost',   name:'Lost & Found',   color:'var(--pin-red)',     pin:'#d64545', desc:'Lost something on campus? Found something? Post it.' },
  { id:'general',name:'General Board',  color:'var(--pin-plum)',    pin:'#8e5a8f', desc:'Rides, roommates, tutoring, anything else.' },
  { id:'sports',name:'Gorlok Sports',  color:'var(--pin-blue)',    pin:'#3e6fa0', desc:'Sports events and activities.' },
];

function catInfo(id){ return CATEGORIES.find(c=>c.id===id); }

let posts = [
  { id:1, category:'study', title:'AP Chem study group — Thurs after school', body:'A few of us are meeting in room 214 every Thursday to go over unit material before the next test. All welcome, bring your notes!', name:'Priya S.', contact:'priya.s@school.edu', price:null, date:'2 days ago' },
  { id:2, category:'trade', title:'TI-84 Plus calculator, barely used', body:'Upgraded to a newer model so selling my old one. Works perfectly, comes with the case. Meet at the library.', name:'Jordan M.', contact:'(314) 555-0142', price:'$45', date:'1 day ago' },
  { id:3, category:'clubs', title:'Robotics Club — new member info session', body:'No experience needed! We\'ll cover what we\'re building this season and how to join a sub-team. Snacks provided.', name:'Robotics Club', contact:'robotics@school.edu', price:null, date:'5 hours ago' },
  { id:4, category:'lost', title:'Found: navy blue water bottle', body:'Found in the gym bleachers after Tuesday\'s game. Has a small dent on the bottom and a sticker of a mountain. Come describe it to claim.', name:'Front Office', contact:'main.office@school.edu', price:null, date:'3 days ago' },
  { id:5, category:'trade', title:'Selling: Algebra 2 textbook (like new)', body:'Barely used, no writing inside. Same edition the school is using this year.', name:'Devon K.', contact:'devon.k@school.edu', price:'$15', date:'6 hours ago' },
  { id:6, category:'general', title:'Anyone driving toward Ferguson after practice?', body:'Looking for a ride a couple days a week after 5pm practice, happy to chip in for gas.', name:'Alex T.', contact:'alex.t@school.edu', price:null, date:'1 day ago' },
  { id:7, category:'sports', title:'Gorlok Basketball Game — Tomorrow night', body:'Come support our team! Game starts at 7pm in the gym. Free admission.', name:'Gorlok Sports', contact:'sports@school.edu', price:null, date:'1 day ago' },
  { id:7, category:'study', title:'Need a Spanish 3 study partner', body:'Struggling with subjunctive tense, looking for someone to quiz each other with before the unit test Friday.', name:'Maria L.', contact:'maria.l@school.edu', price:null, date:'4 hours ago' },
];
let nextId = 8;

const state = { view:'home', category:null, postId:null };

/* ---------------- Helpers ---------------- */
function esc(s){
  const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(()=>t.classList.remove('show'), 1800);
}
function go(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- Render ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = header() + body() + fab();
  attachEvents();
}

function header(){
  const crumb = state.view === 'home'
    ? ''
    : `<div class="crumbs"><button data-nav="home">&larr; Back to the board</button></div>`;
  return `
    <header class="site">
       <img src="logo.svg" alt="School logo" class="school-logo">
      <div class="board-sign">
        <h1>Webslist</h1>
        <p>Study groups &middot; clubs &middot; buy/sell/trade &middot; and everything in between</p>
      </div>
      ${crumb}
    </header>`;
}

function fab(){
  return `<button class="post-fab" data-nav="new">📌 Post something</button>`;
}

function body(){
  if(state.view === 'home') return homeView();
  if(state.view === 'listing') return listingView();
  if(state.view === 'detail') return detailView();
  if(state.view === 'new') return newPostView();
  return '';
}

function homeView(){
  const cards = CATEGORIES.map(c=>{
    const count = posts.filter(p=>p.category===c.id).length;
    return `
      <div class="pin-card" data-nav="listing" data-cat="${c.id}">
        <span class="pin" style="background: radial-gradient(circle at 35% 30%, #fff8, ${c.pin} 55%, #0006 100%);"></span>
        <div class="cat-title">${c.name}</div>
        <p class="cat-desc">${c.desc}</p>
        <span class="cat-count">${count} post${count===1?'':'s'}</span>
      </div>`;
  }).join('');
  return `<div class="grid">${cards}</div>`;
}

function listingView(){
  const cat = catInfo(state.category);
  const list = posts
    .filter(p=>p.category===state.category)
    .filter(p=>{
      const q = (document.getElementById('searchBox')?.value || '').toLowerCase();
      if(!q) return true;
      return p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q);
    });

  const rows = list.length ? list.map(p=>`
      <div class="post-row" data-nav="detail" data-id="${p.id}">
        <div>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.body.slice(0,110))}${p.body.length>110?'…':''}</p>
          ${p.price ? `<span class="price-tag">${esc(p.price)}</span>` : ''}
        </div>
        <div class="post-meta">${esc(p.name)}<br>${p.date}</div>
      </div>`).join('')
    : `<div class="empty-note">Nothing posted here yet — be the first to pin something up.</div>`;

  return `
    <div class="panel">
      <div class="listing-head">
        <h2>${cat.name}</h2>
        <div class="search-row">
          <input type="text" id="searchBox" placeholder="Search this board…" oninput="go('listing')">
        </div>
      </div>
      <div class="post-list">${rows}</div>
    </div>`;
}

function detailView(){
  const p = posts.find(x=>x.id===state.postId);
  if(!p) return `<div class="panel"><p>That post isn't here anymore.</p></div>`;
  const cat = catInfo(p.category);
  const tabs = Array.from({length:6}).map((_,i)=>`
      <div class="tear-tab" data-tear="${i}">${esc(p.contact)}</div>`).join('');

  return `
    <div class="detail-card">
      <span class="pin" style="background: radial-gradient(circle at 35% 30%, #fff8, ${cat.pin} 55%, #0006 100%);"></span>
      <div class="tag-row"><span class="cat-chip" style="background:${cat.color}">${cat.name}</span></div>
      <h2>${esc(p.title)}</h2>
      <div class="detail-meta">Posted by ${esc(p.name)} &middot; ${p.date}</div>
      ${p.price ? `<div class="detail-price">${esc(p.price)}</div>` : ''}
      <div class="detail-body">${esc(p.body)}</div>
      <div class="tear-hint">tap a tab to copy the contact info</div>
      <div class="tear-strip">${tabs}</div>
    </div>`;
}

function newPostView(){
  return `
    <div class="index-card">
      <h2>Pin something up</h2>
      <form id="postForm">
        <div class="field">
          <label>Category</label>
          <select id="f-category">
            ${CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Title</label>
          <input type="text" id="f-title" placeholder="e.g. Looking for a Calc BC study buddy">
        </div>
        <div class="field" id="priceField" style="display:none;">
          <label>Price (optional)</label>
          <input type="text" id="f-price" placeholder="e.g. $20 or Trade">
        </div>
        <div class="field">
          <label>Details</label>
          <textarea id="f-body" placeholder="What's this about? Include any details people will need."></textarea>
        </div>
        <div class="two-col">
          <div class="field">
            <label>Your name</label>
            <input type="text" id="f-name" placeholder="First name & last initial">
          </div>
          <div class="field">
            <label>Contact (email or phone)</label>
            <input type="text" id="f-contact" placeholder="you@school.edu">
          </div>
        </div>
        <p class="error-msg" id="formError">Please fill in a title, details, your name, and a way to contact you.</p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Pin it up</button>
          <button type="button" class="btn btn-ghost" data-nav="home">Cancel</button>
        </div>
      </form>
    </div>`;
}

/* ---------------- Events ---------------- */
function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const view = el.getAttribute('data-nav');
      if(view === 'listing') go('listing', {category: el.getAttribute('data-cat')});
      else if(view === 'detail') go('detail', {postId: Number(el.getAttribute('data-id'))});
      else go(view);
    });
  });

  const catSelect = document.getElementById('f-category');
  if(catSelect){
    const priceField = document.getElementById('priceField');
    const syncPrice = ()=>{ priceField.style.display = catSelect.value === 'trade' ? 'flex' : 'none'; };
    catSelect.addEventListener('change', syncPrice);
    syncPrice();
  }

  const form = document.getElementById('postForm');
  if(form){
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const title = document.getElementById('f-title').value.trim();
      const body = document.getElementById('f-body').value.trim();
      const name = document.getElementById('f-name').value.trim();
      const contact = document.getElementById('f-contact').value.trim();
      const category = document.getElementById('f-category').value;
      const price = document.getElementById('f-price')?.value.trim() || null;
      const err = document.getElementById('formError');

      if(!title || !body || !name || !contact){
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';

      const newPost = { id: nextId++, category, title, body, name, contact, price: price || null, date: 'just now' };
      posts.unshift(newPost);
      showToast('Posted to the board!');
      go('detail', {postId: newPost.id});
    });
  }

  document.querySelectorAll('.tear-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const text = tab.textContent;
      if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
      tab.classList.add('torn');
      showToast('Contact info copied!');
    });
  });
}

render();
</script>
</body>
</html>
